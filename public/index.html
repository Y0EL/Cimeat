<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cimeat</title>
    <meta
      name="description"
      content="Lacak kalori tanpa ribet. Foto makanan lo, biar AI yang hitung. Catat dari app, WhatsApp, atau Telegram."
    />
    <meta property="og:title" content="Cimeat" />
    <meta property="og:description" content="Lacak kalori tanpa ribet." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#f97316" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: light }
      * { box-sizing: border-box }
      html, body { margin: 0; padding: 0; height: 100% }
      body {
        font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
        background: #fffaf5;
        color: #431407;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      main { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 48px 24px; max-width: 720px; margin: 0 auto; width: 100% }
      .brand { font-size: 60px; font-weight: 800; color: #f97316; letter-spacing: -0.03em; margin: 0 }
      .tagline { font-size: 18px; color: #9a3412; margin-top: 12px; text-align: center }
      .card { margin-top: 48px; width: 100%; border: 1px solid #fed7aa; border-radius: 20px; padding: 24px; background: #fff7ed }
      .card h2 { margin: 0 0 12px 0; font-size: 14px; text-transform: uppercase; letter-spacing: 0.08em; color: #ea580c; font-weight: 600 }
      .card p { margin: 0; font-size: 16px; line-height: 1.5; color: #7c2d12 }
      footer { text-align: center; padding: 24px; color: #c2410c; font-size: 13px }
    </style>
  </head>
  <body>
    <main>
      <h1 class="brand">Cimeat</h1>
      <p class="tagline">Lacak kalori tanpa ribet. Foto makanan lo, biar AI yang hitung.</p>
      <section class="card">
        <h2>Status</h2>
        <p>Lagi finalisasi MVP. Mobile app, AI diet coach, bot Telegram, dan bot WhatsApp siap menyusul.</p>
      </section>
    </main>
    <footer>Cimeat &middot; cimeat-ya.web.app</footer>
  </body>
</html>
